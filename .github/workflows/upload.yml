name: Instant GPhotos GPMC Pixel XL Worker

on:
  repository_dispatch:
    types: [instant_upload]
  workflow_dispatch:
    inputs:
      task_payload:
        description: 'JSON Task Payload from Main VPS'
        required: true

concurrency:
  group: gpmc_upload_pipeline
  cancel-in-progress: false

jobs:
  upload-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Free SSD Disk Space (45GB+ Available)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GPMC Pixel XL Upload Worker
        env:
          TASK_PAYLOAD: ${{ github.event.client_payload.payload || github.event.inputs.task_payload }}
        run: |
          python worker.py
